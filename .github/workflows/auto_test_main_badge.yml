# Workflow Name
name: Tests Passing
# Set Event Which Triggers Workflow
on:
  push:
    branches:
      - main

jobs:
  test:
    # Using Ubuntu
    runs-on: ubuntu-latest
    container:
      # Using Node JS Version 22
      image: node:22.22.2
    steps:
      # Checkout Code
      - uses: actions/checkout@v3
        with:
          node-version: 22
      # Install Dependencies
      - run: npm install --global npm@12.0.2
      - run: npm ci
      # Run Tests
      - run: npm test
      # Run Build Script
      - run: npm run build
